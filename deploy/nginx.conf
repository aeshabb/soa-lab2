# One public port accepts TLS and redirects plain HTTP. TLS ends in WildFly.
worker_processes 1;
pid .runtime/nginx.pid;
error_log .runtime/nginx.log warn;

events {
    worker_connections 256;
}

stream {
    map $ssl_preread_protocol $ticket_upstream {
        ""      127.0.0.1:@TICKET_REDIRECT_PORT@;
        default 127.0.0.1:@TICKET_BACKEND_PORT@;
    }

    server {
        listen 0.0.0.0:@TICKET_HTTPS_PORT@;
        ssl_preread on;
        preread_timeout 10s;
        proxy_connect_timeout 3s;
        proxy_timeout 60s;
        proxy_next_upstream off;
        proxy_pass $ticket_upstream;
    }
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path .runtime/nginx-client-body;

    # Keep localhost working through the documented SSH tunnel; unknown hosts
    # redirect to the canonical hostname instead of an untrusted Host header.
    map $host $redirect_host {
        default           helios.cs.ifmo.ru;
        helios.cs.ifmo.ru  helios.cs.ifmo.ru;
        localhost         localhost;
        127.0.0.1         127.0.0.1;
    }

    server {
        listen 127.0.0.1:@TICKET_REDIRECT_PORT@;
        server_name _;
        client_header_timeout 10s;
        keepalive_timeout 0;
        add_header Cache-Control no-store always;
        return 308 https://$redirect_host:@TICKET_HTTPS_PORT@$request_uri;
    }
}
